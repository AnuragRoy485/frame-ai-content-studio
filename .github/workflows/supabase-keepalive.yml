name: Supabase keep-alive
on:
  schedule:
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false
jobs:
  database-read:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read constant health view
        env:
          SUPABASE_URL: https://auhqnxgkkimgnlbfyvfq.supabase.co
          # Public browser key only, never a service-role or secret key.
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_PG-7rXmymOLUJ_ozdB9p6w_XrK6ycTy
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 5 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/keepalive_health?select=ok")
          echo "$response" | jq -e 'length == 1 and .[0].ok == 1' >/dev/null
          echo "Supabase read-only database check passed at $(date -u +%FT%TZ)"
# Free standard runner in this public repo. No user data is read or written.
# GitHub can disable schedules after 60 days without repository activity.
# Re-enable/check the workflow if the demo remains needed after that window.
